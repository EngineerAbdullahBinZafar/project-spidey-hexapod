<!-- Authentic Local Fonts -->
<style>
  @font-face {
    font-family: 'SpiderManMovie';
    src: url('assets/libs/fonts/HOMOARAK.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  :root {
    --spidey-crimson: #ff002b;
    --spidey-crimson-glow: rgba(255, 0, 43, 0.75);
    --spidey-royal-navy: #04102e;
    --spidey-electric-cyan: #00f0ff;
    --spidey-cyan-glow: rgba(0, 240, 255, 0.65);
    --spidey-magenta: #ff007f;
    --stark-gold: #ffb703;
    --bg-deep-space: #020614;

    --font-spiderman: 'SpiderManMovie', 'Impact', sans-serif;
    --font-heading: 'Segoe UI', 'Montserrat', -apple-system, sans-serif;
    --font-mono: 'Consolas', 'JetBrains Mono', monospace;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-deep-space);
    overflow: hidden;
    font-family: var(--font-heading);
    color: #ffffff;
    user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Presentation Stage: Strict 16:9 (1920x1080) Logical Canvas */
  #presentation-stage {
    position: absolute;
    width: 1920px;
    height: 1080px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    overflow: hidden;
    background: var(--bg-deep-space);
    box-shadow: 0 0 100px rgba(0, 0, 0, 0.95);
  }

  /* Master Slide Deck Wrapper */
  .slide-viewport {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
  }

  .slide-page {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    display: none;
    flex-direction: column;
    padding: 70px 70px 70px 70px;
    background: radial-gradient(circle at 50% 30%, #082154 0%, #030d24 60%, #020614 100%);
    overflow: hidden;
  }

  .slide-page.active-slide {
    display: flex;
    z-index: 10;
  }

  /* Universal Spider-Verse Comic Halftone Background Texture */
  .comic-halftone-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
      radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.12) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(255, 0, 43, 0.14) 0%, transparent 50%),
      radial-gradient(rgba(255, 255, 255, 0.05) 1.5px, transparent 1.5px),
      linear-gradient(rgba(0, 240, 255, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 28px 28px, 56px 56px, 56px 56px;
    pointer-events: none;
    z-index: 1;
  }

  /* ========================================================= */
  /* SLIDE 1: GROK COVER VIDEO & MASTER REVEAL                 */
  /* ========================================================= */
  #slide-1 {
    padding: 0;
    background: #020614;
  }

  #grok-video-cover {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    object-fit: cover;
    z-index: 3;
    pointer-events: auto;
    cursor: pointer;
  }

  .video-bottom-action {
    position: absolute;
    bottom: 35px;
    right: 45px;
    z-index: 10;
  }

  .btn-mission-start {
    background: linear-gradient(135deg, var(--spidey-crimson), #b3001e);
    color: #ffffff;
    border: none;
    font-family: var(--font-heading);
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 3px;
    padding: 16px 36px;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 0 40px var(--spidey-crimson-glow);
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.25s ease;
  }

  .btn-mission-start:hover {
    transform: scale(1.08);
    box-shadow: 0 0 60px var(--spidey-crimson);
  }

  /* ========================================================= */
  /* SLIDE 2: GEMINI SQUAD VIDEO                               */
  /* ========================================================= */
  #slide-2 {
    padding: 0;
    background: #020614;
  }

  #gemini-squad-video {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    object-fit: cover;
    z-index: 3;
    pointer-events: auto;
    cursor: pointer;
  }

  .slide2-next-btn {
    position: absolute;
    bottom: 35px;
    right: 45px;
    z-index: 10;
  }

  /* ========================================================= */
  /* SLIDES 3 & 4: FULL-BLEED IMAGE SLIDES                     */
  /* ========================================================= */
  .image-slide {
    padding: 0;
    background: #020614;
  }

  .slide-fullbleed-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    object-fit: cover;
    z-index: 3;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .slide-fullbleed-img.img-visible {
    opacity: 1;
  }

  .slide-next-btn {
    position: absolute;
    bottom: 35px;
    right: 45px;
    z-index: 10;
  }

  /* ========================================================= */
  /* GLOBAL SLIDE DECK CONTROLS & HUD                          */
  /* ========================================================= */
  #deck-controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 15px;
    z-index: 50;
    background: rgba(4, 16, 46, 0.85);
    border: 1px solid rgba(0, 240, 255, 0.35);
    padding: 8px 24px;
    border-radius: 30px;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8);
  }

  .nav-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
    padding: 6px 16px;
    border-radius: 20px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .nav-btn:hover {
    background: var(--spidey-electric-cyan);
    color: #020719;
    box-shadow: 0 0 15px var(--spidey-cyan-glow);
  }

  #slide-indicator {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--stark-gold);
    min-width: 90px;
    text-align: center;
  }

  #controls-hud {
    position: absolute;
    top: 24px;
    right: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 50;
    background: rgba(4, 16, 46, 0.75);
    border: 1px solid rgba(0, 240, 255, 0.3);
    padding: 6px 12px;
    border-radius: 6px;
    backdrop-filter: blur(8px);
  }

  .hud-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #ffffff;
    padding: 6px 12px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .hud-btn:hover {
    background: var(--spidey-electric-cyan);
    color: #020719;
    box-shadow: 0 0 15px var(--spidey-cyan-glow);
  }
</style>

<!-- Scripts -->
<script>
  let currentSlide = 1;
  const totalSlides = 11;

  function resizeStage() {
    const stage = document.getElementById('presentation-stage');
    const scaleX = window.innerWidth / 1920;
    const scaleY = window.innerHeight / 1080;
    const scale = Math.min(scaleX, scaleY);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  window.addEventListener('resize', resizeStage);
  window.addEventListener('DOMContentLoaded', resizeStage);

  // Video element IDs per slide (null = no video)
  const slideVideos = {
    1: 'grok-video-cover',
    2: 'gemini-squad-video',
    3: null,
    4: null,
    5: null,
    6: null,
    7: null,
    8: null,
    9: null,
    10: null,
    11: null
  };

  // Image element IDs per slide (null = no image fade-in)
  const slideImages = {
    3: 'img-slide3',
    4: 'img-slide4',
    5: 'img-slide5',
    6: 'img-slide6',
    7: 'img-slide7',
    8: 'img-slide8',
    9: 'img-slide9',
    10: 'img-slide10',
    11: 'img-slide11'
  };

  function updateSlideDisplay() {
    for (let i = 1; i <= totalSlides; i++) {
      const page = document.getElementById(`slide-${i}`);
      const vid  = slideVideos[i]  ? document.getElementById(slideVideos[i])  : null;
      const img  = slideImages[i]  ? document.getElementById(slideImages[i])  : null;

      if (page) {
        if (i === currentSlide) {
          page.classList.add('active-slide');
          if (vid) vid.play().catch(()=>{});
          // Trigger fade-in for image slides with a tiny delay
          if (img) {
            img.classList.remove('img-visible');
            requestAnimationFrame(() => {
              requestAnimationFrame(() => img.classList.add('img-visible'));
            });
          }
        } else {
          page.classList.remove('active-slide');
          if (vid) { vid.pause(); vid.currentTime = 0; }
          if (img)  img.classList.remove('img-visible');
        }
      }
    }
    const indicator = document.getElementById('slide-indicator');
    if (indicator) {
      indicator.textContent = `SLIDE ${String(currentSlide).padStart(2,'0')} / ${String(totalSlides).padStart(2,'0')}`;
    }
  }

  function nextSlide() {
    if (currentSlide < totalSlides) { currentSlide++; updateSlideDisplay(); }
  }
  function prevSlide() {
    if (currentSlide > 1) { currentSlide--; updateSlideDisplay(); }
  }
  function goToSlide(n) {
    if (n >= 1 && n <= totalSlides) { currentSlide = n; updateSlideDisplay(); }
  }

  const btnFullscreen = document.getElementById('btn-fullscreen');
  btnFullscreen.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => console.log(err));
      btnFullscreen.textContent = 'EXIT FS';
    } else {
      document.exitFullscreen().catch(err => console.log(err));
      btnFullscreen.textContent = 'FULLSCREEN';
    }
  });

  // Video click advances to next slide
  const vidCover = document.getElementById('grok-video-cover');
  if (vidCover) vidCover.addEventListener('click', () => goToSlide(2));

  const vidSquad = document.getElementById('gemini-squad-video');
  if (vidSquad) vidSquad.addEventListener('click', () => nextSlide());

  // Keyboard Navigation
  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowRight' || e.code === 'PageDown' || e.code === 'Space') {
      e.preventDefault(); nextSlide();
    } else if (e.code === 'ArrowLeft' || e.code === 'PageUp') {
      e.preventDefault(); prevSlide();
    } else if (e.code === 'KeyF') {
      e.preventDefault(); btnFullscreen.click();
    } else if (e.key >= '1' && e.key <= '9') {
      goToSlide(parseInt(e.key));
    }
  });
</script>
